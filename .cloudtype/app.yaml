# 클라우드타입 배포 설정
# 콘솔에서 "내 GitHub 저장소 배포하기" → NaKyouTae/picky 선택 시 이 파일을 읽습니다.
#
# ── 환경변수는 이 파일에 두지 않습니다 ────────────────────────
# 이 파일의 env 목록은 컨테이너 환경변수를 **통째로 덮어씁니다**. 여기에 일부만 적어 두면
# 콘솔에서 입력한 나머지가 배포 때마다 지워집니다(실제로 그렇게 지워진 적이 있습니다).
# 그래서 env 선언을 아예 두지 않고, 콘솔 [환경변수] 화면을 단일 소스로 씁니다.
#
# ⚠️ env: 블록을 다시 추가하지 마세요. 추가하는 순간 콘솔 값이 전부 날아갑니다.
#
# 콘솔에 등록해야 하는 값은 README 의 "server → 클라우드타입" 표를 참고하세요.
# 콘솔에 이미 배포된 서비스 이름과 일치해야 한다 (다르면 새 서비스가 생기고 URL 도 새로 발급됨)
name: picky
app: dockerfile
options:
  ports: "21000"
  # 저장소 루트를 build context 로 사용 (서브 디렉토리 설정 없이 배포)
  dockerfile: Dockerfile
  healthz: /api/health
context:
  git:
    url: https://github.com/NaKyouTae/picky.git
    branch: main
