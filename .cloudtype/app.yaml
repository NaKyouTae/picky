# 클라우드타입 배포 설정
# 콘솔에서 "내 GitHub 저장소 배포하기" → NaKyouTae/picky 선택 시 이 파일을 읽습니다.
#
# ── 환경변수를 두 군데로 나눈 이유 ────────────────────────────
# 이 저장소는 PUBLIC 이라 비밀값을 여기에 적을 수 없고, [시크릿] 탭은 쓰지 않기로 했습니다.
# 그래서 아래 env 에는 공개돼도 되는 설정만 두고 배포할 때마다 자동으로 덮어씁니다.
# 비밀값은 클라우드타입 콘솔의 [환경변수] 화면에서 직접 입력해 두고, 이 파일은 건드리지 않습니다.
#
# ⚠️ 콘솔에서 직접 입력해야 하는 값 (이 파일에는 없음)
#    DATABASE_URL              Supabase transaction pooler (6543)
#    DIRECT_URL                Supabase direct connection (5432) — 마이그레이션용
#    SUPABASE_URL
#    SUPABASE_SERVICE_ROLE_KEY Supabase > API Keys > Secret key (sb_secret_…)
#    JWT_SECRET
#    ADMIN_TOKEN               어드민 프론트의 ADMIN_TOKEN 과 동일해야 함
#    ADMIN_USERNAME            어드민 로그인 계정 (DB 아님 — 환경변수로 관리)
#    ADMIN_PASSWORD
#    KAKAO_REST_API_KEY        콘솔 선행 설정: 카카오 로그인 + OpenID Connect 활성화,
#    KAKAO_CLIENT_SECRET       동의항목(닉네임·카카오계정 이메일) 사용 설정
#    GOOGLE_CLIENT_ID
#    GOOGLE_CLIENT_SECRET
#    (SUPABASE_ANON_KEY 는 서버 코드가 읽지 않으므로 넣지 않아도 됩니다)
#
# ⚠️ 첫 배포 뒤 콘솔 [환경변수] 화면에서 위 값들이 그대로 남아 있는지 한 번 확인하세요.
#    파일에 없는 변수를 배포가 지우는지 여부는 클라우드타입 문서에 명시돼 있지 않습니다.
#    만약 지워진다면 값을 GitHub Actions 에서 주입하는 방식으로 바꿔야 합니다.
# 콘솔에 이미 배포된 서비스 이름과 일치해야 한다 (다르면 새 서비스가 생기고 URL 도 새로 발급됨)
name: picky
app: dockerfile
options:
  ports: "21000"
  # 저장소 루트를 build context 로 사용 (서브 디렉토리 설정 없이 배포)
  dockerfile: Dockerfile
  healthz: /api/health
  # 아래는 전부 공개돼도 되는 값이라 배포할 때 자동으로 세팅된다.
  # 비밀값은 여기 두지 말고 콘솔 [환경변수] 화면에 직접 입력할 것.
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "21000"
    # 배포된 프론트 도메인 + 로컬 개발용 (쉼표 구분)
    - name: CORS_ORIGINS
      value: "https://picky.spectrify.kr,http://localhost:21001,http://localhost:21002"
    - name: SUPABASE_STORAGE_BUCKET
      value: picky
    - name: JWT_EXPIRES_IN
      value: 7d
    # 카카오 콘솔의 Redirect URI 와 문자 단위로 동일해야 함
    - name: KAKAO_REDIRECT_URI
      value: https://picky.spectrify.kr/auth/kakao/callback
    # 구글 콘솔의 '승인된 리디렉션 URI' 와 문자 단위로 동일해야 함
    - name: GOOGLE_REDIRECT_URI
      value: https://picky.spectrify.kr/auth/google/callback
context:
  git:
    url: https://github.com/NaKyouTae/picky.git
    branch: main
