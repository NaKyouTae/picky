# 서버(NestJS) 자동 배포 — 클라우드타입은 GitHub 연동만으로는 재배포되지 않아
# main 푸시 시 이 워크플로가 배포를 트리거한다.
#
# ⚠️ 사전 설정 (저장소 Settings)
#   Secrets and variables → Actions
#     [Secrets]   CLOUDTYPE_TOKEN    클라우드타입 콘솔 → 설정 → API Key
#     [Variables] CLOUDTYPE_PROJECT  "스페이스/프로젝트" 형식 (예: nakyoutae/picky)
#     [Variables] CLOUDTYPE_STAGE    (선택) 기본값 main
#   설정 전에는 배포를 건너뛰고 경고만 남기므로 CI 가 빨간불이 되지는 않는다.
name: Deploy server (Cloudtype)

on:
  push:
    branches: [main]
    # 서버 이미지에 영향을 주는 변경에만 반응한다 (app/admin 만 바뀌면 재배포하지 않음)
    paths:
      - 'server/**'
      - 'Dockerfile'
      - '.cloudtype/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-server.yml'
  # Actions 탭에서 수동 배포도 가능
  workflow_dispatch:

# 배포가 겹치지 않도록 직렬화
concurrency:
  group: cloudtype-server
  cancel-in-progress: false

jobs:
  deploy:
    name: 클라우드타입 배포
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 배포 설정 확인
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDTYPE_TOKEN }}
          PROJECT: ${{ vars.CLOUDTYPE_PROJECT }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$PROJECT" ]; then
            echo "::warning::CLOUDTYPE_TOKEN(시크릿) 또는 CLOUDTYPE_PROJECT(변수)가 없어 배포를 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 클라우드타입 배포
        if: steps.check.outputs.ready == 'true'
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          project: ${{ vars.CLOUDTYPE_PROJECT }}
          stage: ${{ vars.CLOUDTYPE_STAGE || 'main' }}
          # 배포 설정은 저장소의 단일 소스를 그대로 사용한다
          file: .cloudtype/app.yaml

      - name: 헬스체크
        if: steps.check.outputs.ready == 'true'
        run: |
          URL="https://port-0-picky-mnu9e7w5c4c4121d.sel3.cloudtype.app/api/health"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || true)
            if [ "$code" = "200" ]; then
              echo "✅ 서버 정상 ($URL)"
              exit 0
            fi
            echo "대기 중… ($i/30, 응답 $code)"
            sleep 10
          done
          echo "::error::배포 후 5분 내에 헬스체크가 통과하지 못했습니다."
          exit 1
